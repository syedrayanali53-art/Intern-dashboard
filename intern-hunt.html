<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intern Hunt</title>
<style>
:root{--paper:#f5f6f3;--panel:#fff;--ink:#1e302c;--ink-soft:#61726c;--rule:#d9e1da;--green:#16715b;--blue:#246c9c;--orange:#a74724;--pink:#16715b;--font-b:system-ui,-apple-system,"Segoe UI",sans-serif;--font-m:var(--font-b);--font-d:var(--font-b)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-b);padding-bottom:50px}
button,input,select,textarea{font:inherit;color:inherit}
button,summary{cursor:pointer}
button{background:none;border:none}
button:disabled{opacity:.5;cursor:default}
a{color:var(--green)}
:focus-visible{outline:3px solid #3484b5;outline-offset:3px}
.wrap{max-width:1480px;margin:auto;padding:0 28px}
.mono{font-size:12px;color:var(--ink-soft)}
.masthead{padding:30px 0 22px}
.eyebrow{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:12px}
h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.045em;line-height:1.1;font-weight:750}
.title-dot{color:var(--green)}.tagline{max-width:33ch;color:var(--ink-soft);font-size:14px}
.score{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:12px;background:white;overflow:hidden;margin-bottom:24px}
.stat{padding:16px 22px;border-right:1px solid var(--rule);display:flex;align-items:center;gap:14px}.stat:last-child{border:0}
.stat .n{font-size:28px;font-weight:650;letter-spacing:-.04em}.stat .l{font-size:13px;color:var(--ink-soft)}
.page-tabs{display:flex;gap:26px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.page-tabs button{padding:10px 0 14px;border-bottom:3px solid transparent;color:var(--ink-soft);font-size:15px}
.page-tabs button[aria-pressed=true]{border-color:var(--green);color:var(--ink);font-weight:650}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 0;position:sticky;top:0;background:var(--paper);z-index:60}
.search{flex:1 1 230px;max-width:420px;min-width:180px;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--rule);border-radius:7px;background:white}
.search input{border:0;background:none;min-width:0;width:100%;font-size:14px;outline:none}.search:focus-within{outline:2px solid var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.spacer{flex:1}
.chip,.btn,.mini,.danger,.seg button,.tabs button,.more{font-size:12px;padding:8px 12px;border:1px solid var(--rule);background:white;border-radius:6px;white-space:normal;line-height:1.4}
.chip[aria-pressed=true],.seg button[aria-pressed=true],.tabs button[aria-pressed=true]{background:#e0eee8;border-color:#8db9a8;color:#154f40;font-weight:600}
.btn,.mini.add{background:var(--green);color:white;border-color:var(--green);font-weight:600}
.btn.ghost{background:white;color:var(--green)}
button:hover:not(:disabled){filter:brightness(.96)}
.danger{border-color:#e6b8a9;color:#9b3624}.mini{text-decoration:none;display:inline-block}.mini.done{color:var(--ink-soft);background:#eef2ef;pointer-events:none}
.seg{display:flex;gap:3px;padding:3px;background:#e9ede8;border-radius:8px}.seg button{border-color:transparent}
.filter-menu{position:relative;font-size:13px}.filter-menu>summary{padding:9px 12px;border:1px solid var(--rule);border-radius:7px;background:white;list-style:none}.filter-menu>summary:after{content:" ▾"}
.filter-options{position:absolute;top:46px;left:0;width:300px;background:white;border:1px solid var(--rule);box-shadow:0 8px 24px #20392a18;border-radius:9px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.filter-options small{color:var(--ink-soft);font-size:12px}
.board{display:flex;gap:12px;overflow:auto;align-items:stretch;scrollbar-width:thin;padding-bottom:12px;max-height:65vh}
.col{flex:1 0 238px;min-width:238px;background:#eaf0ea80;border-radius:9px;padding:0 8px 8px}
.col-head{padding:13px 6px;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#eaf0ea!important;z-index:2;border-radius:8px}
.col-head h2{font-size:12px;font-weight:650;flex:1}.dot{width:8px;height:8px;border-radius:50%}.ct{font-size:12px;color:var(--ink-soft)}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:140px}.col-body.over{outline:2px dashed var(--green);outline-offset:3px}
.card{position:relative;padding:14px 12px 12px;border:1px solid var(--rule);border-radius:7px;background:white;cursor:grab}
.card:hover{border-color:#8caf9c;box-shadow:0 2px 6px #20392a0c}.card.dragging{opacity:.4}
.card .pri{position:absolute;top:12px;right:10px;border-radius:4px;font-size:10px;padding:1px 5px;font-weight:600}
.card h3{font-size:14px;line-height:1.35;padding-right:32px;font-weight:650}
.card .sub{font-size:12px;color:var(--ink-soft);margin-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}.card .go{font-size:12px;margin-left:auto;text-decoration:none}
.tagx,.pill{display:inline-block;border-radius:4px;font-size:11px;padding:2px 6px;border:1px solid var(--rule);color:var(--ink-soft);background:#f8faf7}
.tagx.warn{border-color:#efc68d;background:#fff7e7;color:#8a4f15}.tagx.new{background:#e8f3ed;color:#166148}
.empty{padding:20px 10px;color:var(--ink-soft);font-size:13px;text-align:center;border:1px dashed var(--rule);border-radius:7px}
#main{overflow-x:auto}.board-help{font-size:12px;color:var(--ink-soft);margin-top:10px}
table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--rule);margin-top:4px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:top}
th{font-size:11px;font-weight:600;color:var(--ink-soft);background:#edf2ed;white-space:nowrap}
th[data-s]{cursor:pointer}tbody tr{cursor:pointer}tbody tr:hover{background:#f3f7f2}td.c-note{max-width:330px;font-size:12px;color:var(--ink-soft)}
.scrim{position:fixed;inset:0;background:#142c2466;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--paper);border-left:1px solid var(--rule);z-index:201;transform:translateX(101%);transition:transform .22s;overflow:hidden;display:flex;flex-direction:column;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet-hd{position:relative;flex:none;padding:24px;border-bottom:1px solid var(--rule);background:white}
.sheet-bd{flex:1;overflow:auto;padding:6px 24px 50px}
.sheet h2{font-size:26px;line-height:1.2;letter-spacing:-.025em;padding-right:36px;margin-top:6px}
.sheet .close{position:absolute;top:20px;right:20px;width:32px;height:32px;border:1px solid var(--rule);border-radius:6px;background:white;font-size:22px}
.field{margin-top:18px}.field>label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid #b9c9be;border-radius:6px;background:white;font-size:14px}
.field p{font-size:12px;color:var(--ink-soft)}.field textarea{min-height:88px;resize:vertical}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.statgrid button{padding:9px 4px;border:1px solid var(--rule);border-radius:6px;background:white;font-size:12px}
.statgrid button[aria-pressed=true]{background:#deeee4;border-color:#79a991;color:#145b42}
.linklist{display:flex;flex-direction:column;gap:7px}.linklist a{overflow-wrap:anywhere;font-size:12px;padding:10px;border:1px solid var(--rule);border-radius:6px;background:white}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tabs{display:flex;gap:6px;margin-top:18px}.tabs button{flex:1}
.feed-tools{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:-6px;background:var(--paper);padding:12px 0;z-index:3}
.feed-tools input{flex:1 1 100%;width:100%;border:1px solid var(--rule);border-radius:6px;padding:9px;background:white;font-size:13px}
.scout-item{position:relative;border:1px solid var(--rule);border-radius:8px;background:white;padding:16px;margin-bottom:10px}
.scout-item h4{font-size:16px;padding-right:75px}.scout-item .role{font-size:14px;margin-top:5px}.scout-item .when{position:absolute;right:14px;top:17px;font-size:10px;color:var(--ink-soft)}
.scout-item .meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.scout-item p,.attrib{font-size:12px;line-height:1.6;color:var(--ink-soft)}
.scout-item .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.more{width:100%;border-style:dashed}.attrib{margin-top:24px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);z-index:400;background:var(--ink);color:white;border-radius:8px;padding:12px 20px;font-size:13px;max-width:90vw;text-align:center;transition:transform .2s}.toast.on{transform:translate(-50%,0)}
.footnote{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:28px;padding-top:18px;border-top:1px solid var(--rule);color:var(--ink-soft);font-size:12px}
@media(max-width:700px){.wrap{padding:0 16px}.masthead{padding-top:20px}.title-row{display:block}.tagline{margin-top:12px;max-width:none}.score{grid-template-columns:repeat(2,1fr)}.stat{padding:12px 16px;border-bottom:1px solid var(--rule)}.stat:nth-child(2){border-right:0}.stat:nth-child(3){border-bottom:0}.stat .n{font-size:24px}.stat .l{font-size:12px}.toolbar{position:static}.search{flex-basis:100%;max-width:none}.toolbar .spacer{display:none}.filter-options{width:280px}.col{flex:0 0 80vw;min-width:80vw}.board{max-height:65vh}.sheet-hd{padding:20px}.sheet-bd{padding:4px 18px 40px}.footnote>.spacer{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style id="monitor-styles">
#monitor{margin:20px 0;padding:0;background:transparent}
#monitor h2{font-size:25px;margin:0 0 8px}#monitor h3{font-size:18px;margin:20px 0 10px}

.monitor-controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;align-items:center}

.monitor-summary{display:flex;flex-wrap:wrap;gap:8px}.monitor-summary span{background:#e9efea;border-radius:5px;padding:5px 9px;font-size:12px}

.monitor-job{padding:16px;border:1px solid #b9c0c5;border-radius:8px;background:white;min-width:0}

.monitor-job .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.monitor-job a{font-size:13px}
#monitor details{margin-top:18px}#monitor summary{cursor:pointer;font-weight:600}.monitor-sources{max-height:360px;overflow:auto;margin-top:10px}
.monitor-source{border-top:1px solid #d5dadd;padding:9px 0;font-size:13px;overflow-wrap:anywhere}.monitor-source small{display:block;color:#555}
.monitor-warning{border-left:4px solid #b75a00;padding:8px 12px;background:#fff0d8}
#monitor button:focus-visible,#monitor a:focus-visible,#monitor input:focus-visible,#monitor select:focus-visible,#monitor summary:focus-visible{outline:3px solid #0078bf;outline-offset:3px}
.bulk-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;margin:10px 0;border:1px solid var(--rule);background:#eef4f3;border-radius:8px}

.selection-box{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px}.selection-box input{width:18px;height:18px;accent-color:var(--green)}
.posting-count{font-size:12px;color:var(--ink-soft);margin:8px 0}.saved-posting{padding:12px 0;border-top:1px solid var(--rule)}.saved-posting details{font-size:12px;margin-top:8px}
</style>

window.INTERN_MONITOR = {jobs:{},sources:{},events:[],companies:[]};

<script id="storage">
// Preserve original raw values before parsing, migration, or any write.
window.internStorageSafe = true;
window.backupInternStorage = function(reason = 'before-posting-v2') {
  const key = 'internhunt.backup.' + reason;
  if (localStorage.getItem(key)) return key;
  const raw = JSON.stringify({at:new Date().toISOString(), board:localStorage.getItem('internhunt.v1'), monitor:localStorage.getItem('internhunt.monitor.v1')});
  localStorage.setItem(key, raw);
  if (localStorage.getItem(key) !== raw) throw new Error('Backup could not be verified');
  return key;
};
try { window.backupInternStorage(); }
catch { window.internStorageSafe = false; }
window.storage = {
  async get(key) { const value = localStorage.getItem(key); return value === null ? null : {value}; },
  async set(key, value) {
    if (!window.internStorageSafe) throw new Error('Storage backup failed; original data left untouched');
    localStorage.setItem(key, value); return {key};
  }
};
</script>
<script id="eligibility">
/* Posting text only: company reputation and legacy feed labels are not evidence. */
(() => {
  'use strict';
  const negative = /\b(?:(?:will\s+not|won't|do\s+not|does\s+not|unable\s+to|cannot|can't|not\s+able\s+to)\s+(?:currently\s+)?(?:offer\s+|provide\s+)?(?:visa\s+)?sponsor(?:ship)?|no\s+(?:visa\s+)?sponsorship(?!\s+restrictions?\b)|sponsorship\s+(?:is\s+)?(?:not\s+available|unavailable|not\s+offered|not\s+provided)|not\s+eligible\s+for\s+sponsorship|without\s+sponsorship\s+now\s+or\s+in\s+the\s+future|without\s+the\s+need\s+for\s+sponsorship|not\s+(?:currently\s+)?(?:offer|provide)\s+(?:visa\s+)?sponsorship)\b/gi;
  const positive = /\b(?:(?:will|can|we)\s+sponsor|(?:offer|offers|provide|provides)\s+(?:visa\s+)?(?:sponsorship|immigration\s+(?:support|assistance))|(?:visa\s+)?sponsorship\s+(?:is\s+|will\s+be\s+)?(?:available|offered|provided)|immigration(?:\s+(?:support|assistance))?\s+(?:is\s+|will\s+be\s+)?(?:available|offered|provided)|(?:f[- ]?1|cpt|opt)(?:\s*(?:\/|,|and|or)\s*(?:f[- ]?1|cpt|opt))*\s+(?:(?:visa|candidates?|students?|holders?|applicants?)\s+){0,3}(?:are\s+|is\s+)?(?:welcome|accepted|eligible|supported|works?)|(?:accept|accepts|welcome|welcomes|hire|hires|support|supports)\s+(?:(?:candidates?|students?|on|with|an?|the|under|using|valid|currently)\s+){0,6}(?:f[- ]?1|cpt|opt))\b/i;
  // Remove negated acceptance before looking for a positive signal, without
  // erasing a separate positive clause such as "no sponsorship, OPT welcome".
  const negatedPositive = /\b(?:(?:not|never|no\s+longer)\s+(?:currently\s+)?(?:offer|provide|accept|welcome|hire|support)\s+(?:(?:visa|immigration|candidates?|students?|on|with|an?|the|under|using|valid|currently)\s+){0,6}(?:sponsorship|support|assistance|f[- ]?1|cpt|opt)|(?:f[- ]?1|cpt|opt)(?:\s*(?:\/|,|and|or)\s*(?:f[- ]?1|cpt|opt))*\s+(?:(?:visa|candidates?|students?|holders?|applicants?)\s+){0,3}(?:are\s+|is\s+)?(?:not|never)\s+(?:welcome|accepted|eligible|supported))\b/gi;
  const restriction = /\b(?:(?:us|united\s+states)\s+(?:citizens?|persons?)\s+(?:only|required)|(?:us\s+)?citizenship\s+(?:is\s+)?required|(?:security\s+)?clearance\s+(?:is\s+)?required|must\s+be\s+(?:an?\s+)?(?:us|united\s+states)\s+(?:citizen|person)|(?:must\s+(?:have|hold|obtain|maintain)|required\s+to\s+(?:have|hold|obtain|maintain))\s+(?:an?\s+)?(?:active\s+)?(?:security\s+)?clearance|must\s+be\s+able\s+to\s+(?:obtain|maintain)\s+(?:an?\s+)?(?:security\s+)?clearance)\b/i;
  const noRestriction = /\b(?:(?:no|without)\s+(?:(?:us|united\s+states)\s+)?(?:citizenship|(?:security\s+)?clearance)\s+(?:is\s+)?(?:required|needed)|(?:(?:us|united\s+states)\s+)?(?:citizenship|(?:security\s+)?clearance)\s+(?:is\s+)?not\s+(?:required|needed)|not\s+(?:limited|restricted)\s+to\s+(?:us|united\s+states)\s+citizens?\s+only)\b/gi;
  const flatten = value => Array.isArray(value) ? value.map(flatten).join('\n') : typeof value === 'string' ? value : '';
  function plain(value) {
    return flatten(value)
      .replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1>/gi, ' ')
      .replace(/<\/?(?:p|div|li|br|h[1-6])\b[^>]*>/gi, '\n')
      .replace(/<[^>]*>/g, ' ')
      .replace(/&(?:amp|lt|gt|quot|apos|nbsp|#39);/gi, entity => ({'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&apos;':"'",'&#39;':"'",'&nbsp;':' '})[entity.toLowerCase()])
      .replace(/&#(x[0-9a-f]+|\d+);/gi, (_, code) => {
        const n = code[0].toLowerCase() === 'x' ? parseInt(code.slice(1),16) : Number(code);
        return n > 0 && n <= 0x10ffff ? String.fromCodePoint(n) : ' ';
      })
      .replace(/[‘’]/g, "'").replace(/[‐‑–—]/g, '-')
      .replace(/\bu\.\s*s\./gi, 'US').replace(/[^\S\n]+/g, ' ').trim();
  }
  function classify(record = {}) {
    const body = ['posting_text','description','requirements','qualifications'].map(key => plain(record[key])).filter(Boolean);
    const sentences = [plain(record.title || record.t), ...body].join('\n').split(/[.!?;\n]+/).map(s => s.trim()).filter(Boolean);
    let blocked = false, sponsors = false, citizen = false;
    const evidence = [];
    for (const sentence of sentences) {
      let negativeHere = false;
      const unblocked = sentence.replace(negative, () => { negativeHere = true; return ' '; });
      const positiveHere = positive.test(unblocked.replace(negatedPositive, ' '));
      const restrictionHere = restriction.test(sentence.replace(noRestriction, ' '));
      blocked ||= negativeHere; sponsors ||= positiveHere; citizen ||= restrictionHere;
      if ((negativeHere || positiveHere || restrictionHere) && !evidence.includes(sentence)) evidence.push(sentence);
    }
    return {
      sponsorship_state: blocked ? (sponsors ? 'review' : 'blocked') : (sponsors ? 'sponsors' : 'silent'),
      sponsorship_checked: body.length > 0,
      sponsorship_evidence: evidence,
      citizenship_required: citizen
    };
  }
  window.InternEligibility = {classify};
})();
</script>

const KEY = "internhunt.v1";

/* ===================== state ===================== */
let state = null;
window.currentBoardBackup=()=>state;
const ui = {q:"",pri:new Set(),hideClosed:true,onlyLive:true,showRestricted:false,view:"board",sort:"pri"};
ui.selecting=false;
ui.selected=new Set();

let storageOK = true;

function freshState(){
  return {companies:SEED.map(c=>({...c,links:[...c.links],postings:[]})), xp:0, created:Date.now()};
}

async function load(){
  storageOK = window.internStorageSafe;
  // some hosts attach the storage API after the document parses
  for(let i=0; i<20 && !window.storage; i++) await new Promise(r=>setTimeout(r,50));
  if(!window.storage){
    storageOK = false; state = freshState();
    document.getElementById("saveState").textContent = "No storage — export before you close";
    return;
  }
  try{
    const r = await window.storage.get(KEY);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      if(parsed && Array.isArray(parsed.companies)){
        state = parsed;
        migratePostings();
        if(storageOK)save();
        document.getElementById("saveState").textContent = storageOK ? "Saved on this browser" : "Backup failed — changes cannot be saved";
        flag("Restored your saved log");
        return;
      }
      throw new Error("Saved tracking could not be read");
    }
  }catch(e){
    storageOK = false; window.internStorageSafe = false; state = freshState();
    document.getElementById("saveState").textContent = "Saved data could not be read — original preserved. Restore a backup.";
    return;
  }
  state = freshState();
  migratePostings();
  save();
  if(!storageOK) document.getElementById("saveState").textContent = "Backup failed — changes cannot be saved";
}

function assessPosting(r){
  const p={...r,title:r.title||r.t||"",url:r.url||r.u||""};
  return Object.assign(p,window.InternEligibility.classify(p));
}
function migratePostings(){
  const known=new Map(Object.values(window.INTERN_MONITOR?.jobs||{}).map(r=>[r.url,r]));
  for(const c of state.companies){
    c.postings=(c.postings||[]).map(p=>assessPosting({...p,...known.get(p.url),posting_text:known.get(p.url)?.posting_text||p.posting_text||""}));
    for(const url of c.links||[]){
      if(known.has(url)&&!c.postings.some(p=>p.url===url)) c.postings.push(assessPosting(known.get(url)));
    }
  }
  state.postingVersion=2;
}
function allowedPosting(p,hideBlocked=ui.onlyLive,showRestricted=ui.showRestricted){
  return (!hideBlocked||p.sponsorship_state!=="blocked")&&(showRestricted||!p.citizenship_required);
}
function eligibilityLabel(p){
  return ({sponsors:"Sponsorship / student visa accepted",blocked:"No sponsorship",review:"Review — conflicting signals",silent:p.sponsorship_checked?"Sponsorship not mentioned":"Couldn't check"})[p.sponsorship_state];
}
function eligibilityHTML(p){
  return '<span class="tagx '+(["blocked","review"].includes(p.sponsorship_state)?"warn":"")+'">'+esc(eligibilityLabel(p))+'</span>'+
    (p.citizenship_required?'<span class="tagx warn">Citizenship/clearance required</span>':'');
}
function visiblePostings(c){return (c.postings||[]).filter(p=>allowedPosting(p));}
function companyLinks(c){
  return (c.links||[]).filter(url=>{const p=(c.postings||[]).find(p=>p.url===url);return safeHTTP(url)&&(!p||allowedPosting(p));});
}

let saveTimer=null;
async function saveNow(){
  if(!storageOK||!state)return;
  clearTimeout(saveTimer);
  const el=document.getElementById("saveState");
  try{await window.storage.set(KEY,JSON.stringify(state));el.textContent="Saved on this browser";}
  catch{el.textContent="Save failed — back up before closing";}
}
function save(){
  if(!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,300);
}

/* ===================== helpers ===================== */
const $ = s=>document.querySelector(s);
function safeHTTP(value){try{const u=new URL(value);return ["https:","http:"].includes(u.protocol)?u.href:"";}catch{return "";}}
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function flag(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2400);
}
function levelFor(xp){
  let lvl=1, need=120, acc=0;
  while(xp >= acc+need){ acc+=need; lvl++; need=Math.round(need*1.34); }
  return {lvl, into:xp-acc, need};
}
function recalcXP(){
  state.xp = state.companies.reduce((s,c)=>s+(XP[c.status]||0),0);
}
function daysAgo(d){
  if(!d) return null;
  const t=Date.parse(d); if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/86400000);
}

/* ===================== filtering ===================== */
function visible(){
  const q = ui.q.trim().toLowerCase();
  return state.companies.filter(c=>{
    if(ui.pri.size && !ui.pri.has(c.priority)) return false;
    if(ui.hideClosed && c.status==="closed") return false;
    if(q){
      const hay = (c.name+" "+(c.notes||"")+" "+(c.reason||"")+" "+(c.area||"")+" "+(c.tag||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ===================== header render ===================== */
function counts(){
  const o={}; STATUSES.forEach(s=>o[s.k]=0);
  state.companies.forEach(c=>{ if(o[c.status]!=null) o[c.status]++; });
  return o;
}

function renderHeader(){
  const c=counts();
  recalcXP();
  $("#tagline").textContent="Keep track of every company. Find your next internship.";
  $("#score").innerHTML=[["Companies",state.companies.length],["To check",c.tocheck],["Applied",c.applied],["Interviews & offers",c.interview+c.offer]].map(([label,n])=>`<div class="stat"><span class="n">${n}</span><span class="l">${label}</span></div>`).join("");
}

/* ===================== board ===================== */
function cardHTML(c){
  const link = companyLinks(c)[0] || (c.q ? "https://www.google.com/search?q="+encodeURIComponent(c.q) : "");
  const sub = c.area || c.reason || (c.notes||"").slice(0,60) || "No notes yet";
  return `<article class="card" draggable="true" data-id="${esc(c.id)}" tabindex="0" role="button" aria-label="${esc(c.name)}">
      ${ui.selecting?`<label class="selection-box"><input type="checkbox" data-select="${esc(c.id)}" aria-label="Select ${esc(c.name)}" ${ui.selected.has(c.id)?"checked":""}> Select</label>`:""}
      <span class="pri" style="background:${PCOLOR[c.priority]||"#8A9099"};color:${c.priority==="P3"||c.priority==="P4"?"#fff":"#16181A"}">${esc(c.priority)}</span>
      <h3>${esc(c.name)}</h3>
      <div class="sub">${esc(sub)}</div>
      ${(c.postings||[]).length?'<div class="posting-count">'+visiblePostings(c).length+' of '+c.postings.length+' saved roles shown</div>':""}
      <div class="foot">
        ${c.blocker==="visa"?'<span class="tagx">Old visa note · not a filter</span>':""}
        ${c.blocker==="location"?'<span class="tagx warn">Location</span>':""}
        ${c.src==="scout"?'<span class="tagx new">Scouted</span>':""}
        ${c.applyDate?`<span class="tagx">${esc(c.applyDate)}</span>`:""}
        ${link?`<a class="go" href="${esc(link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open ↗</a>`:""}
      </div>
    </article>`;
}

function renderBoard(){
  const list = visible();
  const cols = STATUSES.filter(s=>!(ui.hideClosed && s.k==="closed"));
  const c = counts();
  $("#main").innerHTML = `<div class="board">${cols.map(s=>{
    const items = list.filter(x=>x.status===s.k)
      .sort((a,b)=> a.priority.localeCompare(b.priority) || a.name.localeCompare(b.name));
    return `<section class="col" data-status="${s.k}">
      <div class="col-head" style="background:${s.color}22">
        <span class="dot" style="background:${s.color}"></span>
        <h2>${s.label}</h2><span class="ct">${items.length}</span>
      </div>
      <div class="col-body" data-status="${s.k}">
        ${items.map(cardHTML).join("") || `<div class="empty">${s.k==="offer"?"Waiting on you.":"Nothing here yet."}</div>`}
      </div>
    </section>`;
  }).join("")}</div>`;
  wireBoard();
}

function wireBoard(){
  document.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("dragstart",e=>{
      el.classList.add("dragging");
      e.dataTransfer.setData("text/plain", el.dataset.id);
      e.dataTransfer.effectAllowed="move";
    });
    el.addEventListener("dragend",()=>el.classList.remove("dragging"));
    el.addEventListener("click",e=>{if(!e.target.closest('input,label,a,button'))openSheet(el.dataset.id);});
    el.addEventListener("keydown",e=>{ if(e.target===el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openSheet(el.dataset.id);} });
  });
  document.querySelectorAll(".col-body").forEach(body=>{
    body.addEventListener("dragover",e=>{e.preventDefault();body.classList.add("over");});
    body.addEventListener("dragleave",()=>body.classList.remove("over"));
    body.addEventListener("drop",e=>{
      e.preventDefault(); body.classList.remove("over");
      const id=e.dataTransfer.getData("text/plain");
      setStatus(id, body.dataset.status);
    });
  });
}

/* ===================== list ===================== */
function renderList(){
  const list = visible().slice().sort((a,b)=>{
    if(ui.sort==="name") return a.name.localeCompare(b.name);
    if(ui.sort==="status") return STATUSES.findIndex(s=>s.k===a.status)-STATUSES.findIndex(s=>s.k===b.status) || a.name.localeCompare(b.name);
    if(ui.sort==="date") return (b.applyDate||"").localeCompare(a.applyDate||"");
    return a.priority.localeCompare(b.priority) || a.name.localeCompare(b.name);
  });
  $("#main").innerHTML = `<table>
    <thead><tr>
      ${ui.selecting?"<th>Select</th>":""}
      <th data-s="pri">Pri</th><th data-s="name">Company</th><th data-s="status">Status</th>
      <th>Flag</th><th data-s="date">Applied</th><th>Notes</th><th>Link</th>
    </tr></thead>
    <tbody>${list.map(c=>{
      const link=companyLinks(c)[0]||(c.q?"https://www.google.com/search?q="+encodeURIComponent(c.q):"");
      return `<tr data-id="${esc(c.id)}" tabindex="0" aria-label="Edit ${esc(c.name)}">
        ${ui.selecting?`<td><input type="checkbox" data-select="${esc(c.id)}" aria-label="Select ${esc(c.name)}" ${ui.selected.has(c.id)?"checked":""}></td>`:""}
        <td><span class="pill" style="background:${PCOLOR[c.priority]};color:${c.priority==="P3"||c.priority==="P4"?"#fff":"#16181A"}">${esc(c.priority)}</span></td>
        <td><b>${esc(c.name)}</b>${c.area?`<div style="color:var(--ink-soft);font-size:11.5px">${esc(c.area)}</div>`:""}</td>
        <td><span class="pill" style="border-color:${SMAP[c.status].color};color:${c.status==="interview"?"#8a7a00":SMAP[c.status].color}">${SMAP[c.status].label}</span></td>
        <td>${c.blocker?`<span class="pill" style="border-color:var(--orange);color:var(--orange)">${esc(c.blocker)}</span>`:""}</td>
        <td class="mono" style="font-size:11px">${esc(c.applyDate||"")}</td>
        <td class="c-note">${esc((c.notes||c.reason||"").slice(0,110))}</td>
        <td>${link?`<a href="${esc(link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="mono" style="font-size:10px">Open ↗</a>`:""}</td>
      </tr>`;}).join("")}</tbody></table>`;
  document.querySelectorAll("tbody tr").forEach(tr=>{
    tr.onclick=e=>{if(!e.target.closest('input,a,button'))openSheet(tr.dataset.id);};
    tr.onkeydown=e=>{if(e.target===tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openSheet(tr.dataset.id);}};
  });
  document.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{ui.sort=th.dataset.s;render();});
}

/* ===================== mutations ===================== */
function setStatus(id, status){
  const c = state.companies.find(x=>x.id===id);
  if(!c || c.status===status) return;
  c.status = status;
  if(status==="applied" && !c.applyDate) c.applyDate = new Date().toISOString().slice(0,10);
  if(status!=="closed") c.reason = "";
  recalcXP(); save(); render();
  flag(c.name+" → "+SMAP[status].label);
}

/* ===================== detail sheet ===================== */
function openSheet(id){
  const c = state.companies.find(x=>x.id===id); if(!c) return;
  const links = companyLinks(c).filter(url=>!(c.postings||[]).some(p=>p.url===url));
  if(!links.length && c.q) links.push("https://www.google.com/search?q="+encodeURIComponent(c.q));
  $("#sheet").innerHTML = `
    <div class="sheet-hd">
      <button class="close" aria-label="Close">×</button>
      <div class="mono" style="color:var(--ink-soft)">${esc(c.area||c.tag||"From your sheet")}</div>
      <h2>${esc(c.name)}</h2>
    </div>
    <div class="sheet-bd">
    <div class="field"><label>Status</label>
      <div class="statgrid">${STATUSES.map(s=>
        `<button data-st="${s.k}" aria-pressed="${c.status===s.k}">${s.label}</button>`).join("")}</div>
    </div>
    <div class="field"><label>Priority</label>
      <select id="fPri">${["P1","P2","P3","P4"].map(p=>`<option ${c.priority===p?"selected":""}>${p}</option>`).join("")}</select>
    </div>
    <div class="field"><label>Date applied</label><input id="fDate" type="date" value="${esc(c.applyDate||"")}"></div>
    <div class="field"><label>Referral contact</label><input id="fRef" value="${esc(c.referral||"")}" placeholder="Who can introduce you?"></div>
    <div class="field"><label>Notes</label><textarea id="fNotes" placeholder="What happened, what's next…">${esc(c.notes||"")}</textarea></div>
    ${c.reason?`<div class="field"><label>Closed because</label><input id="fReason" value="${esc(c.reason)}"></div>`:""}
    ${links.length?`<div class="field"><label>Links</label><div class="linklist">${
      links.map(l=>`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l.length>78?l.slice(0,78)+"…":l)}</a>`).join("")}</div></div>`:""}
    ${(c.postings||[]).length?`<div class="field"><label>Saved internships</label><p>${c.postings.length-visiblePostings(c).length} hidden by eligibility filters. Use the toolbar to show them.</p>${visiblePostings(c).map(p=>`<article class="saved-posting"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a><div>${eligibilityHTML(p)}</div>${p.sponsorship_evidence?.length?`<details><summary>Matched posting text</summary><p>${esc(p.sponsorship_evidence.join(" · "))}</p></details>`:""}</article>`).join("")}</div>`:""}
    <div class="field"><label>Add a link</label><input id="fNewLink" placeholder="https://… then press Enter"></div>
    <div class="rowbtns">
      <button class="btn" id="saveBtn">Save changes</button>
      <button class="danger" id="delBtn">Remove</button>
    </div></div>`;
  const sheet=$("#sheet");
  sheet.querySelector(".close").onclick=closeSheet;
  sheet.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
    sheet.querySelectorAll("[data-st]").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
  });
  sheet.querySelector("#fNewLink").addEventListener("keydown",e=>{
    if(e.key==="Enter" && e.target.value.trim()){
      const url=safeHTTP(e.target.value.trim());
      if(!url){flag("Enter an http or https link");return;}
      c.links=c.links||[];if(!c.links.includes(url))c.links.push(url);
      e.target.value="";save();flag("Link added");
    }
  });
  sheet.querySelector("#saveBtn").onclick=()=>{
    const st = sheet.querySelector('[data-st][aria-pressed="true"]').dataset.st;
    c.priority = sheet.querySelector("#fPri").value;
    c.applyDate = sheet.querySelector("#fDate").value;
    c.referral = sheet.querySelector("#fRef").value;
    c.notes = sheet.querySelector("#fNotes").value;
    const rs = sheet.querySelector("#fReason"); if(rs) c.reason = rs.value;
    if(st!==c.status){ setStatus(id, st); } else { recalcXP(); save(); render(); flag("Saved"); }
    closeSheet();
  };
  sheet.querySelector("#delBtn").onclick=()=>{
    if(deleteCompanies([id]))closeSheet();
  };
  showSheet();
}

let returnFocus=null;
function showSheet(){
  if(!$("#sheet").classList.contains("on"))returnFocus=document.activeElement;
  $("#sheet").classList.add("on");$("#scrim").classList.add("on");$(".wrap").inert=true;
  $("#sheet").querySelector("input,button,select,textarea")?.focus();
}
function closeSheet(){
  if(!$("#sheet").classList.contains("on"))return;
  $("#sheet").classList.remove("on");$("#scrim").classList.remove("on");$(".wrap").inert=false;
  (returnFocus?.isConnected?returnFocus:$("#openAdd")).focus();
}

function normName(n){
  return String(n).toLowerCase()
    .replace(/\b(inc|llc|corp|corporation|ltd|co|company|technologies|technology|group|international|solutions|systems)\b\.?/g,"")
    .replace(/[^a-z0-9]/g,"");
}

let feedData = REPO.slice();
window.setMonitorFeed = jobs => { feedData = jobs.map(assessPosting); };
window.trackMonitorRole = role => { const result=addListing(role); save(); render(); flag(result.msg); };
ui.tab = "feed";
ui.feed = {q:"",dmv:false,rem:false,hideBlocked:true,showRestricted:false,n:40};

function feedMatches(){
  const f=ui.feed, q=f.q.trim().toLowerCase();
  return feedData.filter(r=>{
    if(f.dmv && !r.dmv) return false;
    if(f.rem && !r.rem) return false;
    if(!allowedPosting(r,f.hideBlocked,f.showRestricted)) return false;
    if(q && !(r.c+" "+r.t+" "+r.l+" "+(r.g||"")).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderFeed(){
  const f=ui.feed, hits=feedMatches(), shown=hits.slice(0,f.n);
  const taken = state.taken || (state.taken={});
  const tracking = new Set(state.companies.map(c=>normName(c.name)));
  $("#scoutBody").innerHTML = `
    <div class="feed-tools">
      <input id="fq" type="search" placeholder="Search company, role, location…" value="${esc(f.q)}">
      <button class="chip" data-f="dmv"    aria-pressed="${f.dmv}">DC · MD · VA</button>
      <button class="chip" data-f="rem"    aria-pressed="${f.rem}">Remote</button>
      <button class="chip" data-f="hideBlocked" aria-pressed="${f.hideBlocked}">Hide no sponsorship</button>
      <button class="chip" data-f="showRestricted" aria-pressed="${f.showRestricted}">Show citizenship / clearance</button>
    </div>
    <div class="mono" style="color:var(--ink-soft);margin-bottom:10px">${hits.length} roles${hits.length>f.n?" · showing "+shown.length:""}</div>
    ${shown.map(r=>{
      const on = !!taken[r.u];
      const badge = eligibilityHTML(r);
      const known = tracking.has(normName(r.c));
      return `<div class="scout-item">
        <span class="when">${esc(r.d)}</span>
        <h4>${esc(r.c)}${known?' <span class="tagx" style="vertical-align:2px">already tracking</span>':""}</h4>
        <div class="role">${esc(r.t)}</div>
        <div class="meta">${r.l?`<span class="tagx">${esc(r.l)}</span>`:""}<span class="tagx">${esc(r.m)}</span>${r.g?`<span class="tagx">${esc(r.g)}</span>`:""}${badge}</div>
        <div class="acts">
          <button class="mini ${on?"done":"add"}" data-u="${esc(r.u)}">${on?"On your board":(known?"Add role":"Add")}</button>
          <a class="mini" href="${esc(r.u)}" target="_blank" rel="noopener">Open posting ↗</a>
        </div></div>`;}).join("") || `<div class="empty">No roles match. Loosen a filter.</div>`}
    ${hits.length>f.n?`<button class="more" id="moreBtn">Show ${Math.min(40,hits.length-f.n)} more</button>`:""}
    <div class="attrib">
      Last daily check: ${esc(window.INTERN_MONITOR?.generated_at || "Not run yet")}. Jobs come from your careers watchlist and <b>vanshb03 / CSCareers</b>. Postings close fast — always
      confirm on the employer's own page.
      <div style="margin-top:9px"><button class="mini" id="syncBtn">Reload daily results</button></div>
    </div>`;
  const bd=$("#scoutBody");
  const qi=bd.querySelector("#fq");
  qi.oninput=()=>{ f.q=qi.value; f.n=40; renderFeed();
    const el=$("#scoutBody").querySelector("#fq"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); };
  bd.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ f[b.dataset.f]=!f[b.dataset.f]; f.n=40; renderFeed(); });
  const mb=bd.querySelector("#moreBtn"); if(mb) mb.onclick=()=>{ f.n+=40; renderFeed(); };
  bd.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const r=feedData.find(x=>x.u===b.dataset.u); if(!r) return;
    const res=addListing(r); save(); render(); renderFeed(); flag(res.msg);
  });
  bd.querySelector("#syncBtn").onclick=e=>liveSync(e.currentTarget);
}

function addListing(r){
  const posting=assessPosting(r);
  state.taken = state.taken || {};
  state.taken[r.u] = 1;
  const hit = state.companies.find(c=>normName(c.name)===normName(r.c));
  if(hit){
    hit.postings=hit.postings||[];
    const existing=hit.postings.findIndex(p=>p.url===posting.url);
    if(existing>=0){hit.postings[existing]=posting;return {msg:"Already saved to "+hit.name};}
    hit.postings.push(posting);
    hit.links = hit.links || [];
    if(!hit.links.includes(r.u)) hit.links.push(r.u);
    hit.notes = (hit.notes ? hit.notes+" · " : "") + r.t + (r.l?" ("+r.l+")":"");
    // Monitoring and adding a role do not overwrite personal application status.
    recalcXP();
    return {msg:"Role added to "+hit.name};
  }
  state.companies.unshift({
    id:"r"+Math.random().toString(36).slice(2,8), name:r.c,
    priority: r.dmv ? "P1" : (r.rem ? "P2" : "P3"),
    links:[r.u], notes:r.t, status:"tocheck",
    blocker:"", postings:[posting],
    reason:"", referral:"", applyDate:"", area:r.l, tag:r.g||"From repo", src:"repo"
  });
  recalcXP();
  return {msg:r.c+" added to To check"};
}

async function liveSync(btn){
  btn.disabled=true;
  try { await window.refreshMonitor(); renderFeed(); flag("Loaded latest daily results"); }
  catch { flag("Could not reload results. Showing saved snapshot."); }
  finally { btn.disabled=false; }
}

function addScout(s, quiet){
  if(state.companies.some(c=>normName(c.name)===normName(s.name))) return false;
  state.companies.unshift({
    id:"g"+Math.random().toString(36).slice(2,8), name:s.name, priority:s.pri,
    links:[], q:s.name+" internship 2027 careers", notes:s.why, status:"tocheck",
    blocker:"", postings:[], reason:"", referral:"", applyDate:"",
    area:s.area, tag:s.tag, src:"scout"
  });
  if(!quiet) recalcXP();
  return true;
}

/* ===================== export / reset ===================== */
function exportCSV(){
  const head=["Priority","Company","Status","Blocker","Applied","Referral","Notes","Links"];
  const rows=state.companies.map(c=>[
    c.priority,c.name,SMAP[c.status].label,c.blocker||"",c.applyDate||"",
    c.referral||"",(c.notes||c.reason||""),(c.links||[]).join(" | ")
  ]);
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="intern-hunt.csv"; a.click(); URL.revokeObjectURL(a.href);
  flag("CSV downloaded");
}

/* ===================== wiring ===================== */
function renderSelection(){
  const shown=new Set(visible().map(c=>c.id));
  ui.selected=new Set([...ui.selected].filter(id=>shown.has(id)));
  $("#bulkBar").hidden=!ui.selecting;
  $("#selectMode").setAttribute("aria-pressed",String(ui.selecting));
  $("#selectionCount").textContent=ui.selected.size+" companies selected";
  $("#deleteSelected").disabled=ui.selected.size===0;
  $("#undoBar").hidden=!state.undoDelete;
  if(state.undoDelete)$("#undoLabel").textContent=state.undoDelete.items.length+" companies deleted";
  document.querySelectorAll("[data-select]").forEach(box=>{
    box.checked=ui.selected.has(box.dataset.select);
    box.onchange=()=>{box.checked?ui.selected.add(box.dataset.select):ui.selected.delete(box.dataset.select);renderSelection();};
    box.onkeydown=e=>e.stopPropagation();
  });
}
function deleteCompanies(ids){
  const selected=new Set(ids);
  const items=state.companies.map((company,index)=>({company,index})).filter(x=>selected.has(x.company.id));
  if(!items.length||!confirm("Delete "+items.length+" selected "+(items.length===1?"company":"companies")+" and their saved roles from this browser? You can undo this deletion."))return false;
  const urls=new Set(items.flatMap(x=>[...(x.company.links||[]),...(x.company.postings||[]).map(p=>p.url)]));
  const taken=Object.fromEntries(Object.entries(state.taken||{}).filter(([url])=>urls.has(url)));
  state.undoDelete={items,taken};
  state.companies=state.companies.filter(c=>!selected.has(c.id));
  for(const url of urls)if(!state.companies.some(c=>(c.links||[]).includes(url)))delete state.taken?.[url];
  ui.selected.clear();save();render();flag(items.length+" companies deleted — Undo is available");
  return true;
}
function undoCompanyDelete(){
  const deleted=state.undoDelete;if(!deleted)return;
  for(const item of deleted.items){
    if(!state.companies.some(c=>c.id===item.company.id))state.companies.splice(Math.min(item.index,state.companies.length),0,item.company);
  }
  state.taken={...state.taken,...deleted.taken};
  delete state.undoDelete;save();render();flag("Deletion undone");
}
function render(){ renderHeader(); ui.view==="board"?renderBoard():renderList(); renderSelection(); }

function wire(){
  const showPanel=name=>{
    $("#trackerPanel").hidden=name!=="tracker";$("#discoverPanel").hidden=name!=="discover";
    $("#trackerTab").setAttribute("aria-pressed",String(name==="tracker"));$("#discoverTab").setAttribute("aria-pressed",String(name==="discover"));
  };
  $("#trackerTab").onclick=()=>showPanel("tracker");
  $("#discoverTab").onclick=()=>showPanel("discover");
  const pc=$("#priChips");
  ["P1","P2","P3","P4"].forEach(p=>{
    const b=document.createElement("button");
    b.className="chip "+p.toLowerCase(); b.textContent=p; b.setAttribute("aria-pressed","false");
    b.onclick=()=>{ ui.pri.has(p)?ui.pri.delete(p):ui.pri.add(p);
      b.setAttribute("aria-pressed",String(ui.pri.has(p))); render(); };
    pc.appendChild(b);
  });
  $("#q").addEventListener("input",e=>{ui.q=e.target.value;render();});
  $("#hideClosed").onclick=e=>{ui.hideClosed=!ui.hideClosed;e.currentTarget.setAttribute("aria-pressed",String(ui.hideClosed));render();};
  $("#onlyLive").onclick=e=>{ui.onlyLive=!ui.onlyLive;e.currentTarget.setAttribute("aria-pressed",String(ui.onlyLive));render();};
  $("#showRestricted").onclick=e=>{ui.showRestricted=!ui.showRestricted;e.currentTarget.setAttribute("aria-pressed",String(ui.showRestricted));render();};
  $("#viewBoard").onclick=()=>{ui.view="board";$("#viewBoard").setAttribute("aria-pressed","true");$("#viewList").setAttribute("aria-pressed","false");render();};
  $("#viewList").onclick=()=>{ui.view="list";$("#viewList").setAttribute("aria-pressed","true");$("#viewBoard").setAttribute("aria-pressed","false");render();};
  $("#openAdd").onclick=openAdd;
  $("#openScout").onclick=openScout;
  $("#selectMode").onclick=()=>{ui.selecting=!ui.selecting;ui.selected.clear();render();};
  $("#finishSelection").onclick=()=>{ui.selecting=false;ui.selected.clear();render();};
  $("#selectShown").onclick=()=>{ui.selected=new Set(visible().map(c=>c.id));renderSelection();};
  $("#clearSelected").onclick=()=>{ui.selected.clear();renderSelection();};
  $("#deleteSelected").onclick=()=>deleteCompanies([...ui.selected]);
  $("#undoDelete").onclick=undoCompanyDelete;
  $("#scrim").onclick=closeSheet;
  $("#exportBtn").onclick=exportCSV;
  $("#resetBtn").onclick=()=>{
    if(!confirm("Reset the board to your original sheet? Everything you've changed here is lost.")) return;
    try{window.backupInternStorage("before-reset-"+Date.now());}catch{flag("Could not back up tracking. Reset cancelled.");return;}
    state=freshState(); save(); render(); flag("Back to the original sheet");
  };
  const tb=document.querySelector(".toolbar");
  const setTbh=()=>document.documentElement.style.setProperty("--tbh",
    (getComputedStyle(tb).position==="sticky" ? tb.offsetHeight : 0)+"px");
  if(window.ResizeObserver) new ResizeObserver(setTbh).observe(tb);
  window.addEventListener("resize",setTbh); setTbh();

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape") closeSheet();
    if(e.key==="Tab"&&$("#sheet").classList.contains("on")){
      const items=[...$("#sheet").querySelectorAll('button:not(:disabled),input,select,textarea,a[href],summary')].filter(el=>el.offsetParent!==null);
      const first=items[0],last=items.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
    }
    if(e.key==="/"&&!$("#sheet").classList.contains("on")&&!document.activeElement.matches("input,textarea,select,[contenteditable]")&&!$("#trackerPanel").hidden){
      e.preventDefault(); $("#q").focus();
    }
  });
  window.addEventListener("pagehide",saveNow);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)saveNow();});
}

(async function init(){
  wire();
  await load();
  render();
})();
</script>

<script id="monitor-ui">
(() => {
  'use strict';
  const KEY = 'internhunt.monitor.v1';
  const safe = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const webURL = value => { try {const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:'#';} catch{return '#';} };
  let preferences = {};
  try { preferences = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { window.internStorageSafe=false; }
  let model = window.INTERN_MONITOR || {jobs:{},sources:{},events:[],companies:[]};
  let query='', filter='open', watchlist=true, location='all', hideCitizenOnly=preferences.hideCitizenOnly!==false, hideNoSponsor=preferences.hideNoSponsor!==false, limit=8;
  const openCompanies=new Set(), selectedRoles=new Set();
  let selectingRoles=false;
  const savePreferences = () => {try {if(!window.internStorageSafe)throw new Error('Backup unavailable');localStorage.setItem(KEY,JSON.stringify(preferences));} catch {window.alert('Browser storage is unavailable. Tracking cannot be saved here.');}};
  const date = value => value ? new Date(value).toLocaleString() : 'Never';
  const classifyModel=()=>{for(const r of Object.values(model.jobs))Object.assign(r,window.InternEligibility.classify(r));};
  classifyModel();
  const excluded = r => (hideCitizenOnly&&r.citizenship_required)||(hideNoSponsor&&r.sponsorship_state==='blocked');
  const toFeed = r => ({id:r.id,c:r.company,t:r.title,u:r.url,l:r.locations.join(' · '),m:r.season||'Season not confirmed',g:'',posting_text:r.posting_text||'',description:r.description||'',requirements:r.requirements||'',qualifications:r.qualifications||'',d:r.first_seen.slice(0,10),dmv:r.locations.some(l=>/\b(VA|Virginia|DC|MD|Maryland|Arlington|Reston|McLean|Herndon|Bethesda)\b/i.test(l))?1:0,rem:r.remote||r.locations.some(l=>/remote/i.test(l))?1:0,...window.InternEligibility.classify(r)});
  function syncFeed(){window.setMonitorFeed(Object.values(model.jobs).filter(j=>j.status==='open'&&!preferences.deleted?.[j.id]).map(toFeed));}
  function render(){
    const all=Object.values(model.jobs), sources=Object.values(model.sources).filter(s=>s.enabled!==false);
    const latest=new Map();
    for(const event of model.events) if(event.job_id) latest.set(event.job_id,event);
    const unread=model.events.filter(e=>['new','reopened'].includes(e.kind)&&e.at>(preferences.readThrough||'')&&!preferences.deleted?.[e.job_id]&&(!watchlist||e.company_id)&&(!model.jobs[e.job_id]||!excluded(model.jobs[e.job_id])));
    const ignored=preferences.ignored||{};
    const selected=all.filter(r=>{
      if(watchlist&&!r.company_id)return false;
      if(filter==='deleted')return !!preferences.deleted?.[r.id]&&(r.company+' '+r.title).toLowerCase().includes(query.toLowerCase());
      if(preferences.deleted?.[r.id])return false;
      if(excluded(r))return false;
      if(filter==='ignored')return !!ignored[r.id];
      if(ignored[r.id])return false;
      if(filter==='open'&&r.status!=='open')return false;
      if(filter==='closed'&&r.status!=='closed')return false;
      if(filter==='new'&&!unread.some(e=>e.job_id===r.id))return false;
      if(location==='dmv'&&!toFeed(r).dmv)return false;
      if(location==='remote'&&!toFeed(r).rem)return false;
      return (r.company+' '+r.title+' '+r.locations.join(' ')).toLowerCase().includes(query.toLowerCase());
    }).sort((a,b)=>a.priority.localeCompare(b.priority)||(latest.get(b.id)?.at||b.first_seen).localeCompare(latest.get(a.id)?.at||a.first_seen));
    const groups=new Map();
    for(const role of selected){const key=role.company_id?'id:'+role.company_id:'name:'+role.company.toLowerCase();if(!groups.has(key))groups.set(key,{name:role.company,jobs:[]});groups.get(key).jobs.push(role);}
    const shownRoles=[...groups.values()].slice(0,limit).flatMap(g=>g.jobs), shownIds=new Set(shownRoles.map(r=>r.id));
    for(const id of selectedRoles)if(!shownIds.has(id))selectedRoles.delete(id);
    const ok=sources.filter(s=>s.status==='ok').length, partial=sources.filter(s=>s.status==='partial').length, failed=sources.filter(s=>s.status==='error');
    const pageWatches=sources.filter(s=>s.status==='page_watch');
    const pageChanges=model.events.filter(e=>e.kind==='page_changed'&&e.at>(preferences.readThrough||''));
    const missing=model.companies.filter(c=>c.enabled!==false&&!c.careers_urls?.length);
    const stale=model.generated_at && Date.now()-Date.parse(model.generated_at)>36*3600000;
    document.getElementById('monitor').innerHTML=`
      <h2>Daily job monitor</h2>
      <p>${model.generated_at?'Last check: '+safe(date(model.generated_at)):'Run the checker to start monitoring.'} · Your application statuses stay under your control.</p>
      ${stale?'<p class="monitor-warning">These results are more than 36 hours old. Run the daily workflow and reload the latest board data.</p>':''}
      <div class="monitor-summary"><span>${unread.length} unread role updates</span><span>${all.filter(j=>j.status==='open'&&!excluded(j)).length} open or discovered roles</span><span>${ok} complete sources</span><span>${partial} partial sources</span><span>${pageWatches.length} page watches</span><span>${failed.length+missing.length} need attention</span></div>
      ${pageChanges.length?`<p class="monitor-warning">${pageChanges.length} careers pages changed. Review: ${pageChanges.slice(0,12).map(e=>`<a href="${safe(webURL(e.url))}" target="_blank" rel="noopener">${safe(e.company)}</a>`).join(', ')}. These changes are not confirmed new roles.</p>`:''}
      <div class="monitor-controls">
        <input id="mq" aria-label="Search monitored jobs" placeholder="Search roles, companies, locations" value="${safe(query)}">
        <select id="mf" aria-label="Job status"><option value="open">Open roles</option><option value="new">Unread updates</option><option value="closed">Closed roles</option><option value="ignored">Ignored roles</option><option value="deleted">Deleted roles</option></select>
        <select id="ml" aria-label="Job location"><option value="all">All locations</option><option value="dmv">DC / MD / VA</option><option value="remote">Remote</option></select>
        <label><input type="checkbox" id="mw" ${watchlist?'checked':''}>My companies only</label>
        <label><input type="checkbox" id="mc" ${hideCitizenOnly?'checked':''}>Hide citizenship / clearance required</label>
        <label><input type="checkbox" id="ms" ${hideNoSponsor?'checked':''}>Hide explicit no sponsorship</label>
        <button class="mini" id="selectRoles" aria-pressed="${selectingRoles}">${selectingRoles?'Done selecting':'Select roles'}</button><button class="mini" id="markRead">Mark updates read</button><button class="mini" id="reloadMonitor">Reload results</button>
      </div>
      <p>${selected.length} matching roles across ${groups.size} companies. Alerts start after a source’s first successful check. “Open” means last reported open by a source.</p>
      <div class="bulk-bar" ${selectingRoles?'':'hidden'}><span id="roleSelectionCount" aria-live="polite">${selectedRoles.size} roles selected</span><button class="mini" id="selectShownRoles">Select displayed roles (${shownRoles.length})</button><button class="mini" id="clearRoles">Clear</button><button class="danger" id="deleteRoles" ${!selectedRoles.size||filter==='deleted'?'disabled':''}>Delete selected roles</button></div>
      ${preferences.undoDelete?.length?`<div class="bulk-bar"><span>${preferences.undoDelete.length} roles deleted from this browser</span><button class="mini" id="undoRoles">Undo deletion</button></div>`:''}
      <div class="monitor-jobs">${[...groups].slice(0,limit).map(([key,group])=>`<details class="monitor-company" data-company="${safe(key)}" ${query||openCompanies.has(key)?'open':''}>
        <summary><span>${safe(group.name)}</span><span>${group.jobs.length} ${group.jobs.length===1?'internship':'internships'}</span></summary>
        <div class="monitor-company-jobs">${group.jobs.map(r=>{
        const event=latest.get(r.id), fresh=event&&event.at>(preferences.readThrough||'');
        const staleJob=!r.last_verified||Date.now()-Date.parse(r.last_verified)>36*3600000;
        const saved=preferences.jobs?.[r.id]||'not_started';
        return `<article class="monitor-job">${selectingRoles?`<label class="selection-box"><input type="checkbox" data-select-role="${safe(r.id)}" aria-label="Select ${safe(r.company+' '+r.title)}" ${selectedRoles.has(r.id)?'checked':''}> Select role</label>`:''}<span class="event">${safe(fresh?event.kind:r.priority+' · '+r.status)}</span>
          <h3>${safe(r.title)}</h3><p>${safe(r.locations.slice(0,3).join(' · ')||'Location not supplied')}${r.locations.length>3?' · +'+(r.locations.length-3)+' more':''}</p>
          ${r.locations.length>3?`<details><summary>All locations</summary><p>${safe(r.locations.join(' · '))}</p></details>`:''}
          <p>${safe(r.season||'Season not confirmed')} · ${eligibilityHTML(r)}</p>
          ${r.sponsorship_evidence?.length?`<details><summary>Matched posting text</summary><p>${safe(r.sponsorship_evidence.join(' · '))}</p></details>`:''}
          <p>${r.verified?'Last reported open: '+safe(date(r.last_verified)):'Unverified posting link — check employer page'}${staleJob&&r.status==='open'?' · Needs a fresh check':''}</p>
          <label>My application <select data-app="${r.id}" aria-label="Application status for ${safe(r.company+' '+r.title)}">${[['not_started','Not started'],['saved','Saved'],['applied','Applied'],['interview','Interview'],['offer','Offer'],['rejected','Rejected']].map(([v,l])=>`<option value="${v}" ${saved===v?'selected':''}>${l}</option>`).join('')}</select></label>
          <div class="actions"><a href="${safe(webURL(r.url))}" target="_blank" rel="noopener noreferrer">Open posting ↗</a><button class="mini" data-track="${r.id}">Add to company</button><button class="mini" data-ignore="${r.id}">${ignored[r.id]?'Unignore':'Ignore'}</button>${preferences.deleted?.[r.id]?`<button class="mini" data-restore-role="${r.id}">Restore role</button>`:''}</div></article>`;
      }).join('')}</div></details>`).join('')||'<p>No roles match these filters.</p>'}</div>
      ${groups.size>limit?'<button class="mini" id="moreMonitor" style="margin-top:12px">Show more companies</button>':''}
      <details><summary>Source coverage and problems (${sources.length+missing.length})</summary><p>Partial sources discover jobs but never infer closures from missing listings. Page watches alert when visible page content changes; they cannot verify individual jobs and may flag unrelated text changes. Companies without a careers URL can still match the community feed.</p><div class="monitor-sources">${[...failed,...sources.filter(s=>s.status!=='error')].map(s=>`<div class="monitor-source"><strong>${safe(s.company)}</strong> — ${safe(s.status.replace('_',' '))}${s.count!==undefined&&s.status!=='page_watch'?' · '+s.count+' roles':''}<small>${safe(s.error||s.method||'')} · Last success: ${safe(date(s.last_success))}</small><a href="${safe(webURL(s.url))}" target="_blank" rel="noopener">Source page</a></div>`).join('')}${missing.map(c=>`<div class="monitor-source"><strong>${safe(c.name)}</strong> — careers URL needed</div>`).join('')}</div></details>`;
    document.getElementById('selectRoles').onclick=()=>{selectingRoles=!selectingRoles;selectedRoles.clear();render();};
    const updateSelection=()=>{document.getElementById('roleSelectionCount').textContent=selectedRoles.size+' roles selected';document.getElementById('deleteRoles').disabled=!selectedRoles.size||filter==='deleted';document.querySelectorAll('[data-select-role]').forEach(box=>box.checked=selectedRoles.has(box.dataset.selectRole));};
    document.querySelectorAll('[data-select-role]').forEach(box=>box.onchange=()=>{box.checked?selectedRoles.add(box.dataset.selectRole):selectedRoles.delete(box.dataset.selectRole);updateSelection();});
    document.getElementById('selectShownRoles').onclick=()=>{for(const r of shownRoles)selectedRoles.add(r.id);updateSelection();};
    document.getElementById('clearRoles').onclick=()=>{selectedRoles.clear();updateSelection();};
    document.getElementById('deleteRoles').onclick=()=>{
      if(!selectedRoles.size||!confirm('Delete '+selectedRoles.size+' selected roles from this browser’s view? They remain available under Deleted roles.'))return;
      preferences.undoDelete=[...selectedRoles];preferences.deleted=preferences.deleted||{};
      for(const id of selectedRoles)preferences.deleted[id]=true;
      selectedRoles.clear();savePreferences();syncFeed();render();
    };
    document.getElementById('undoRoles')?.addEventListener('click',()=>{
      for(const id of preferences.undoDelete||[])delete preferences.deleted[id];
      delete preferences.undoDelete;savePreferences();syncFeed();render();
    });
    document.querySelectorAll('[data-restore-role]').forEach(button=>button.onclick=()=>{delete preferences.deleted[button.dataset.restoreRole];savePreferences();syncFeed();render();});
    document.getElementById('mf').value=filter;document.getElementById('ml').value=location;
    document.getElementById('mq').oninput=e=>{const cursor=e.target.selectionStart;query=e.target.value;limit=24;render();const box=document.getElementById('mq');box.focus();box.setSelectionRange(cursor,cursor);};
    document.getElementById('mf').onchange=e=>{filter=e.target.value;limit=24;render();};
    document.getElementById('ml').onchange=e=>{location=e.target.value;limit=24;render();};
    document.getElementById('mw').onchange=e=>{watchlist=e.target.checked;render();};
    document.getElementById('mc').onchange=e=>{hideCitizenOnly=e.target.checked;preferences.hideCitizenOnly=hideCitizenOnly;savePreferences();syncFeed();render();};
    document.getElementById('ms').onchange=e=>{hideNoSponsor=e.target.checked;preferences.hideNoSponsor=hideNoSponsor;savePreferences();syncFeed();render();};
    document.getElementById('markRead').onclick=()=>{preferences.readThrough=model.generated_at||new Date().toISOString();savePreferences();render();};
    document.getElementById('reloadMonitor').onclick=async()=>{try{await window.refreshMonitor();}catch{window.alert('Could not reload results. Keep the data folder beside this file, or open the hosted board.');}};
    document.getElementById('moreMonitor')?.addEventListener('click',()=>{limit+=24;render();});
    document.querySelectorAll('.monitor-company').forEach(group=>group.addEventListener('toggle',()=>{if(query)return;if(group.open)openCompanies.add(group.dataset.company);else openCompanies.delete(group.dataset.company);}));
    document.querySelectorAll('[data-app]').forEach(b=>b.onchange=()=>{preferences.jobs=preferences.jobs||{};preferences.jobs[b.dataset.app]=b.value;savePreferences();});
    document.querySelectorAll('[data-ignore]').forEach(b=>b.onclick=()=>{preferences.ignored=preferences.ignored||{};preferences.ignored[b.dataset.ignore]=!preferences.ignored[b.dataset.ignore];savePreferences();render();});
    document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>window.trackMonitorRole(toFeed(model.jobs[b.dataset.track])));
  }
  window.refreshMonitor=async()=>{
    const base=location.protocol==='file:'?'https://syedrayanali53-art.github.io/Intern-dashboard/':location.href;
    const response=await fetch(new URL('data/monitor.json?t='+Date.now(),base),{cache:'no-store'});
    if(!response.ok)throw new Error('Results unavailable');
    const next=await response.json();
    if(!next.jobs||!next.sources||!Array.isArray(next.events)||!Array.isArray(next.companies))throw new Error('Invalid results');
    model=next;window.INTERN_MONITOR=model;classifyModel();syncFeed();render();
  };
  function download(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
  document.getElementById('backupBtn').onclick=async()=>{download('intern-hunt-backup.json',{version:1,board:window.currentBoardBackup(),monitor:preferences});};
  document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();
  document.getElementById('restoreFile').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const backup=JSON.parse(await file.text());
      if(backup.version!==1||!Array.isArray(backup.board?.companies)||!backup.monitor||typeof backup.monitor!=='object')throw new Error('Not an Intern Hunt backup');
      for(const c of backup.board.companies){if(typeof c.name!=='string'||typeof c.id!=='string'||!Array.isArray(c.links)||c.links.some(l=>webURL(l)==='#'))throw new Error('Invalid company or URL in backup');}
      if(!confirm('Replace this browser’s tracking with the selected backup?'))return;
      await saveNow();
      const snapshotKey=window.backupInternStorage('before-restore-'+Date.now());
      const original=JSON.parse(localStorage.getItem(snapshotKey));
      try {
        localStorage.setItem('internhunt.v1',JSON.stringify(backup.board));
        localStorage.setItem(KEY,JSON.stringify(backup.monitor));
      } catch(error) {
        for(const [key,value] of [['internhunt.v1',original.board],[KEY,original.monitor]]) {
          try {if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}catch{}
        }
        throw new Error('Restore failed. Original data is preserved in '+snapshotKey);
      }
      clearTimeout(saveTimer);storageOK=false;
      window.location.reload();
    }catch(error){window.alert('Could not restore: '+error.message);}
  };
  syncFeed();render();
})();
</script>
</html>
